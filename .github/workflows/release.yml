name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number without v prefix (e.g. 2.1.0)'
        required: true
        type: string

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_PAT }}
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must be semver format (e.g. 2.1.0)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ inputs.version }}" | grep -q .; then
            echo "ERROR: tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Validate CHANGELOG entry
        run: |
          if ! grep -q "^## \[${{ inputs.version }}\]" CHANGELOG.md; then
            echo "ERROR: No entry for version ${{ inputs.version }} found in CHANGELOG.md"
            echo "Add a '## [${{ inputs.version }}] - YYYY-MM-DD' section to CHANGELOG.md and commit it before triggering this workflow."
            exit 1
          fi

      - name: Bump versions
        run: |
          VERSION="${{ inputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          jq --arg v "$VERSION" '.version = $v' apps/simulate/package.json > tmp.json && mv tmp.json apps/simulate/package.json
          jq --arg v "$VERSION" '.version = $v' apps/client/package.json > tmp.json && mv tmp.json apps/client/package.json
          jq --arg v "$VERSION" '.expo.version = $v' apps/client/app.json > tmp.json && mv tmp.json apps/client/app.json

      - name: Commit and push version bump
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json apps/simulate/package.json apps/client/package.json apps/client/app.json
          git commit -m "chore: release v${{ inputs.version }}"
          git push

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Extract changelog section
        run: |
          VERSION="${{ inputs.version }}"
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "---" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**Play now (web):** https://dabb.degler.info" >> /tmp/release-notes.md

      - name: Create GitHub Release (draft)
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}

      - name: Publish GitHub Release
        run: gh release edit "v${{ inputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
