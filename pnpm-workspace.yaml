packages:
  - 'apps/*'
  - 'packages/*'

# Refuse to resolve dependency versions published less than a day ago —
# gives the community time to catch and pull malicious releases first.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild

# Security floors for transitive dependencies. Only keep entries that still
# change resolution — an override that matches what pnpm resolves anyway is
# invisible rot, and pinning a direct dependency here silently reverts
# Dependabot bumps (see the react/react-dom pin removed in 4.1.1).
overrides:
  undici: ^7.24.5
  picomatch: ^4.0.4
  # express 4 (via firebase-tools) pins qs exactly, so nothing but an override moves it
  # off the version carrying GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx.
  qs: ^6.16.0
